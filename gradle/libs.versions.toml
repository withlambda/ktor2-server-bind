[versions]

ktor="2.0.0"
ksp = "2.1.21-2.0.2"
kotlin = "2.1.21"
dokka = "2.0.0"
kover = "0.9.1"
ktlint = "12.1.2"
detekt = "1.23.8"
jreleaser = "1.27.0"
slf4j-nop = "1.7.36"
konform-version = "0.11.1"

[libraries]

### Common module

ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }

# Kotlinx-Serialization
kotlinx-serialization = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
konform = { module = "io.konform:konform", version.ref = "konform-version" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-callid = { module = "io.ktor:ktor-server-call-id", version.ref = "ktor" }

# Jvm Test specific libraries
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j-nop" }

# KSP processor
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }


[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
jreleaser = { id = "org.jreleaser", version.ref = "jreleaser" }
