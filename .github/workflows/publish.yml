name: Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      publish_type:
        description: "Publish type"
        required: true
        default: snapshot
        type: choice
        options:
          - snapshot
          - release

permissions:
  contents: read

jobs:
  publish:
    name: Publish (${{ github.event.inputs.publish_type }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate publish type matches build.gradle.kts (root)
        # Fail fast if the isRelease flag in the root build file does not match
        # the publishing type selected in the workflow dispatch input.
        run: |
          IS_RELEASE=$(grep -E '^\s*val isRelease\s*=' build.gradle.kts | grep -o 'true\|false')
          echo "isRelease in root build.gradle.kts: $IS_RELEASE"
          if [ "${{ github.event.inputs.publish_type }}" = "release" ] && [ "$IS_RELEASE" = "false" ]; then
            echo "ERROR: publish_type is 'release' but isRelease=false in build.gradle.kts. Set isRelease=true before triggering a release."
            exit 1
          fi
          if [ "${{ github.event.inputs.publish_type }}" = "snapshot" ] && [ "$IS_RELEASE" = "true" ]; then
            echo "ERROR: publish_type is 'snapshot' but isRelease=true in build.gradle.kts. Set isRelease=false or use the 'release' publish type."
            exit 1
          fi

      - name: Validate publish type matches build.gradle.kts (processor)
        # Both modules must always be released together and share the same isRelease flag.
        # Fail fast if the processor's flag does not match the root's flag.
        run: |
          IS_RELEASE_PROCESSOR=$(grep -E '^\s*val isRelease\s*=' ktor2-server-bind-processor/build.gradle.kts | grep -o 'true\|false')
          echo "isRelease in ktor2-server-bind-processor/build.gradle.kts: $IS_RELEASE_PROCESSOR"
          if [ "${{ github.event.inputs.publish_type }}" = "release" ] && [ "$IS_RELEASE_PROCESSOR" = "false" ]; then
            echo "ERROR: publish_type is 'release' but isRelease=false in ktor2-server-bind-processor/build.gradle.kts. Set isRelease=true in both build files before triggering a release."
            exit 1
          fi
          if [ "${{ github.event.inputs.publish_type }}" = "snapshot" ] && [ "$IS_RELEASE_PROCESSOR" = "true" ]; then
            echo "ERROR: publish_type is 'snapshot' but isRelease=true in ktor2-server-bind-processor/build.gradle.kts. Set isRelease=false in both build files or use the 'release' publish type."
            exit 1
          fi

      - name: Publish snapshot
        if: github.event.inputs.publish_type == 'snapshot'
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: ./gradlew publish --no-daemon

      - name: Publish release (signed)
        if: github.event.inputs.publish_type == 'release'
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: |
          ./gradlew publish --no-daemon \
            -PSIGNING_KEY_ID="${{ secrets.SIGNING_KEY_ID }}" \
            -PSIGNING_KEY="${{ secrets.SIGNING_KEY }}" \
            -PSIGNING_PASSWORD="${{ secrets.SIGNING_PASSWORD }}" \
            -PenableGradleSigningPlugin=true

      - name: Release summary
        if: github.event.inputs.publish_type == 'release'
        run: |
          echo "### Release staged on OSSRH :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Both artifacts have been signed and uploaded to the OSSRH staging repository:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`com.withlambda:ktor2-server-bind\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`com.withlambda:ktor2-server-bind-processor\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Open https://s01.oss.sonatype.org and log in." >> $GITHUB_STEP_SUMMARY
          echo "2. Go to **Staging Repositories** and find the new repository." >> $GITHUB_STEP_SUMMARY
          echo "3. Click **Close**, wait for checks to pass, then click **Release**." >> $GITHUB_STEP_SUMMARY
          echo "4. Both artifacts will appear on Maven Central within ~10–30 minutes." >> $GITHUB_STEP_SUMMARY

      - name: Snapshot summary
        if: github.event.inputs.publish_type == 'snapshot'
        run: |
          echo "### Snapshot published :package:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Snapshot artifacts are available at:" >> $GITHUB_STEP_SUMMARY
          echo "\`https://s01.oss.sonatype.org/content/repositories/snapshots/com/withlambda/\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Published snapshots:" >> $GITHUB_STEP_SUMMARY
          echo "- \`com.withlambda:ktor2-server-bind\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`com.withlambda:ktor2-server-bind-processor\`" >> $GITHUB_STEP_SUMMARY
