name: Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      publish_type:
        description: "Publish type"
        required: true
        default: snapshot
        type: choice
        options:
          - snapshot
          - release

permissions:
  contents: read

jobs:
  publish:
    name: Publish (${{ github.event.inputs.publish_type }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read project version
        id: version
        run: echo "value=$(grep '^projectVersion=' gradle.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"

      - name: Validate branch and publish type
        run: |
          BRANCH="${{ github.ref_name }}"
          TYPE="${{ github.event.inputs.publish_type }}"
          if [[ "$BRANCH" == releases/v* && "$TYPE" != "release" ]]; then
            echo "::error::Release branches (releases/v*) only allow publish_type=release."
            exit 1
          fi
          if [[ "$BRANCH" != releases/v* && "$TYPE" != "snapshot" ]]; then
            echo "::error::Non-release branches only allow publish_type=snapshot."
            exit 1
          fi

      - name: Publish snapshot
        if: github.event.inputs.publish_type == 'snapshot'
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          ./gradlew publish --no-daemon \
            -PisRelease=false

      - name: Publish release (signed)
        if: github.event.inputs.publish_type == 'release'
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          ./gradlew publish --no-daemon \
            -PisRelease=true \
            -PSIGNING_KEY_ID="${{ secrets.SIGNING_KEY_ID }}" \
            -PSIGNING_KEY="${{ secrets.SIGNING_KEY }}" \
            -PSIGNING_PASSWORD="${{ secrets.SIGNING_PASSWORD }}" \
            -PenableGradleSigningPlugin=true

      - name: Release summary
        if: github.event.inputs.publish_type == 'release'
        run: |
          echo "### Release uploaded to Central Portal :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Both artifacts (\`${{ steps.version.outputs.value }}\`) have been signed and uploaded to the Sonatype Central Portal:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`io.withlambda:ktor2-server-bind:${{ steps.version.outputs.value }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`io.withlambda:ktor2-server-bind-processor:${{ steps.version.outputs.value }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Open https://central.sonatype.com and log in." >> $GITHUB_STEP_SUMMARY
          echo "2. Go to **Deployments** and find the new deployment." >> $GITHUB_STEP_SUMMARY
          echo "3. Click **Publish** to promote both artifacts to Maven Central." >> $GITHUB_STEP_SUMMARY
          echo "4. Both artifacts will appear on Maven Central within ~10–30 minutes." >> $GITHUB_STEP_SUMMARY

      - name: Snapshot summary
        if: github.event.inputs.publish_type == 'snapshot'
        run: |
          echo "### Snapshot published :package:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Snapshot artifacts (\`${{ steps.version.outputs.value }}-SNAPSHOT\`) are available at:" >> $GITHUB_STEP_SUMMARY
          echo "\`https://central.sonatype.com/repository/maven-snapshots/io/withlambda/\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Published snapshots:" >> $GITHUB_STEP_SUMMARY
          echo "- \`io.withlambda:ktor2-server-bind:${{ steps.version.outputs.value }}-SNAPSHOT\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`io.withlambda:ktor2-server-bind-processor:${{ steps.version.outputs.value }}-SNAPSHOT\`" >> $GITHUB_STEP_SUMMARY
