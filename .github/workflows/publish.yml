name: Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.0 for a release, 1.0.1 for the next snapshot base)"
        required: true
      publish_type:
        description: "Publish type"
        required: true
        default: snapshot
        type: choice
        options:
          - snapshot
          - release

permissions:
  contents: read

jobs:
  publish:
    name: Publish (${{ github.event.inputs.publish_type }} ${{ github.event.inputs.version }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish snapshot
        if: github.event.inputs.publish_type == 'snapshot'
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: |
          ./gradlew publish --no-daemon \
            -PprojectVersion="${{ github.event.inputs.version }}" \
            -PisRelease=false

      - name: Publish release (signed)
        if: github.event.inputs.publish_type == 'release'
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: |
          ./gradlew publish --no-daemon \
            -PprojectVersion="${{ github.event.inputs.version }}" \
            -PisRelease=true \
            -PSIGNING_KEY_ID="${{ secrets.SIGNING_KEY_ID }}" \
            -PSIGNING_KEY="${{ secrets.SIGNING_KEY }}" \
            -PSIGNING_PASSWORD="${{ secrets.SIGNING_PASSWORD }}" \
            -PenableGradleSigningPlugin=true

      - name: Release summary
        if: github.event.inputs.publish_type == 'release'
        run: |
          echo "### Release staged on OSSRH :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Both artifacts (\`${{ github.event.inputs.version }}\`) have been signed and uploaded to the OSSRH staging repository:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`com.withlambda:ktor2-server-bind:${{ github.event.inputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`com.withlambda:ktor2-server-bind-processor:${{ github.event.inputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Open https://s01.oss.sonatype.org and log in." >> $GITHUB_STEP_SUMMARY
          echo "2. Go to **Staging Repositories** and find the new repository." >> $GITHUB_STEP_SUMMARY
          echo "3. Click **Close**, wait for checks to pass, then click **Release**." >> $GITHUB_STEP_SUMMARY
          echo "4. Both artifacts will appear on Maven Central within ~10–30 minutes." >> $GITHUB_STEP_SUMMARY

      - name: Snapshot summary
        if: github.event.inputs.publish_type == 'snapshot'
        run: |
          echo "### Snapshot published :package:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Snapshot artifacts (\`${{ github.event.inputs.version }}-SNAPSHOT\`) are available at:" >> $GITHUB_STEP_SUMMARY
          echo "\`https://s01.oss.sonatype.org/content/repositories/snapshots/com/withlambda/\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Published snapshots:" >> $GITHUB_STEP_SUMMARY
          echo "- \`com.withlambda:ktor2-server-bind:${{ github.event.inputs.version }}-SNAPSHOT\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`com.withlambda:ktor2-server-bind-processor:${{ github.event.inputs.version }}-SNAPSHOT\`" >> $GITHUB_STEP_SUMMARY
